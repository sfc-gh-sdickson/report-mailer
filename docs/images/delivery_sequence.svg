<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1240" height="640" fill="#ffffff"/>
  <text x="620.0" y="40" text-anchor="middle" fill="#1a1a2e" font-size="24" font-weight="bold">Delivery Sequence (one run)</text>
  <text x="620.0" y="64" text-anchor="middle" fill="#666" font-size="13">Owner&#x27;s-rights code only enqueues; the caller&#x27;s-rights dispatcher launches the job</text>
  <rect x="40" y="110" width="250" height="74" rx="10" fill="#1B3A6B" filter="url(#sh)"/>
  <text x="165.0" y="143.0" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Trigger</text>
  <text x="165.0" y="161.0" text-anchor="middle" fill="#f0f9ff" font-size="11">CRON task or Send now</text>
  <circle cx="40" cy="110" r="13" fill="#fff" stroke="#1B3A6B" stroke-width="2"/>
  <text x="40" y="114.5" text-anchor="middle" fill="#1B3A6B" font-size="12" font-weight="bold">1</text>
  <path d="M290,147 L340,147" fill="none" stroke="#1B3A6B" stroke-width="2"/>
  <polygon points="331,142 331,152 340,147" fill="#1B3A6B"/>
  <rect x="340" y="110" width="250" height="74" rx="10" fill="#7b61ff" filter="url(#sh)"/>
  <text x="465.0" y="143.0" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">ENQUEUE_RUN()</text>
  <text x="465.0" y="161.0" text-anchor="middle" fill="#f0f9ff" font-size="11">RUNS row · status QUEUED</text>
  <circle cx="340" cy="110" r="13" fill="#fff" stroke="#7b61ff" stroke-width="2"/>
  <text x="340" y="114.5" text-anchor="middle" fill="#7b61ff" font-size="12" font-weight="bold">2</text>
  <path d="M590,147 L640,147" fill="none" stroke="#7b61ff" stroke-width="2"/>
  <polygon points="631,142 631,152 640,147" fill="#7b61ff"/>
  <rect x="640" y="110" width="250" height="74" rx="10" fill="#00a843" filter="url(#sh)"/>
  <text x="765.0" y="143.0" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Dispatcher task</text>
  <text x="765.0" y="161.0" text-anchor="middle" fill="#f0f9ff" font-size="11">WHEN STREAM_HAS_DATA</text>
  <circle cx="640" cy="110" r="13" fill="#fff" stroke="#00a843" stroke-width="2"/>
  <text x="640" y="114.5" text-anchor="middle" fill="#00a843" font-size="12" font-weight="bold">3</text>
  <path d="M890,147 L940,147" fill="none" stroke="#00a843" stroke-width="2"/>
  <polygon points="931,142 931,152 940,147" fill="#00a843"/>
  <rect x="940" y="110" width="250" height="74" rx="10" fill="#e8530e" filter="url(#sh)"/>
  <text x="1065.0" y="143.0" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">EXECUTE JOB SERVICE</text>
  <text x="1065.0" y="161.0" text-anchor="middle" fill="#f0f9ff" font-size="11">ASYNC · run_id template</text>
  <circle cx="940" cy="110" r="13" fill="#fff" stroke="#e8530e" stroke-width="2"/>
  <text x="940" y="114.5" text-anchor="middle" fill="#e8530e" font-size="12" font-weight="bold">4</text>
  <path d="M1065,184 L1065,230 L165,230 L165,290" fill="none" stroke="#e8530e" stroke-width="2"/>
  <polygon points="160,281 170,281 165,290" fill="#e8530e"/>
  <rect x="40" y="290" width="250" height="74" rx="10" fill="#e8530e" filter="url(#sh)"/>
  <text x="165.0" y="323.0" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Refresh + render</text>
  <text x="165.0" y="341.0" text-anchor="middle" fill="#f0f9ff" font-size="11">optional proc · Chromium</text>
  <circle cx="40" cy="290" r="13" fill="#fff" stroke="#e8530e" stroke-width="2"/>
  <text x="40" y="294.5" text-anchor="middle" fill="#e8530e" font-size="12" font-weight="bold">5</text>
  <path d="M290,327 L340,327" fill="none" stroke="#e8530e" stroke-width="2"/>
  <polygon points="331,322 331,332 340,327" fill="#e8530e"/>
  <rect x="340" y="290" width="250" height="74" rx="10" fill="#29b5e8" filter="url(#sh)"/>
  <text x="465.0" y="323.0" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Publish outputs</text>
  <text x="465.0" y="341.0" text-anchor="middle" fill="#f0f9ff" font-size="11">@REPORT_OUTPUTS/&lt;run_id&gt;/</text>
  <circle cx="340" cy="290" r="13" fill="#fff" stroke="#29b5e8" stroke-width="2"/>
  <text x="340" y="294.5" text-anchor="middle" fill="#29b5e8" font-size="12" font-weight="bold">6</text>
  <path d="M590,327 L640,327" fill="none" stroke="#29b5e8" stroke-width="2"/>
  <polygon points="631,322 631,332 640,327" fill="#29b5e8"/>
  <rect x="640" y="290" width="250" height="74" rx="10" fill="#e8530e" filter="url(#sh)"/>
  <text x="765.0" y="323.0" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Send</text>
  <text x="765.0" y="341.0" text-anchor="middle" fill="#f0f9ff" font-size="11">native + provider</text>
  <circle cx="640" cy="290" r="13" fill="#fff" stroke="#e8530e" stroke-width="2"/>
  <text x="640" y="294.5" text-anchor="middle" fill="#e8530e" font-size="12" font-weight="bold">7</text>
  <path d="M890,327 L940,327" fill="none" stroke="#e8530e" stroke-width="2"/>
  <polygon points="931,322 931,332 940,327" fill="#e8530e"/>
  <rect x="940" y="290" width="250" height="74" rx="10" fill="#7b61ff" filter="url(#sh)"/>
  <text x="1065.0" y="323.0" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Log + status</text>
  <text x="1065.0" y="341.0" text-anchor="middle" fill="#f0f9ff" font-size="11">DELIVERY_LOG · RUNS</text>
  <circle cx="940" cy="290" r="13" fill="#fff" stroke="#7b61ff" stroke-width="2"/>
  <text x="940" y="294.5" text-anchor="middle" fill="#7b61ff" font-size="12" font-weight="bold">8</text>
  <rect x="40" y="420" width="360" height="190" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="220.0" y="444" text-anchor="middle" fill="#334155" font-size="14" font-weight="bold">Status values</text>
  <line x1="50" y1="456" x2="390" y2="456" stroke="#64748b" stroke-opacity="0.35" stroke-width="1"/>
  <text x="54" y="475" text-anchor="start" fill="#444" font-size="11">QUEUED → LAUNCHING → RUNNING</text>
  <text x="54" y="493" text-anchor="start" fill="#444" font-size="11">→ SUCCEEDED | PARTIAL | FAILED</text>
  <text x="54" y="511" text-anchor="start" fill="#444" font-size="11">PARTIAL = some sent, some failed/rejected</text>
  <text x="54" y="529" text-anchor="start" fill="#444" font-size="11">RECONCILE_RUNS every 15 min fails stuck runs</text>
  <text x="54" y="547" text-anchor="start" fill="#444" font-size="11">Job metadata kept 30 days</text>
  <rect x="440" y="420" width="360" height="190" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="620.0" y="444" text-anchor="middle" fill="#334155" font-size="14" font-weight="bold">Readiness before screenshot</text>
  <line x1="450" y1="456" x2="790" y2="456" stroke="#64748b" stroke-opacity="0.35" stroke-width="1"/>
  <text x="454" y="475" text-anchor="start" fill="#444" font-size="11">load + networkidle</text>
  <text x="454" y="493" text-anchor="start" fill="#444" font-size="11">optional wait_selector</text>
  <text x="454" y="511" text-anchor="start" fill="#444" font-size="11">window.REPORT_READY === true, or</text>
  <text x="454" y="529" text-anchor="start" fill="#444" font-size="11">500 ms of DOM quiet (30 s cap)</text>
  <text x="454" y="547" text-anchor="start" fill="#444" font-size="11">animations frozen (CSS + Chart.js/ECharts/HC)</text>
  <rect x="840" y="420" width="360" height="190" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1020.0" y="444" text-anchor="middle" fill="#334155" font-size="14" font-weight="bold">Failure handling</text>
  <line x1="850" y1="456" x2="1190" y2="456" stroke="#64748b" stroke-opacity="0.35" stroke-width="1"/>
  <text x="854" y="475" text-anchor="start" fill="#444" font-size="11">Provider 429/5xx: retry with backoff</text>
  <text x="854" y="493" text-anchor="start" fill="#444" font-size="11">One native call per recipient</text>
  <text x="854" y="511" text-anchor="start" fill="#444" font-size="11">Launch errors → RUNS.error_message</text>
  <text x="854" y="529" text-anchor="start" fill="#444" font-size="11">Logs: SYSTEM$GET_SERVICE_LOGS</text>
  <text x="854" y="547" text-anchor="start" fill="#444" font-size="11">Run history tab in the app</text>
</svg>
