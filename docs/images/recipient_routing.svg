<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1240" height="700" fill="#ffffff"/>
  <text x="620.0" y="40" text-anchor="middle" fill="#1a1a2e" font-size="24" font-weight="bold">Recipient Routing</text>
  <text x="620.0" y="64" text-anchor="middle" fill="#666" font-size="13">Every recipient is classified, validated, and logged</text>
  <rect x="470" y="95" width="300" height="56" rx="10" fill="#1B3A6B" filter="url(#sh)"/>
  <text x="620.0" y="119.0" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">SCHEDULE_RECIPIENTS</text>
  <text x="620.0" y="137.0" text-anchor="middle" fill="#f0f9ff" font-size="11">or TEST override (requesting user)</text>
  <rect x="80" y="210" width="320" height="66" rx="10" fill="#29b5e8" filter="url(#sh)"/>
  <text x="240.0" y="239.0" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">SNOWFLAKE_USER / SNOWFLAKE_ROLE</text>
  <text x="240.0" y="257.0" text-anchor="middle" fill="#f0f9ff" font-size="11">resolve via ACCOUNT_USAGE</text>
  <rect x="840" y="210" width="320" height="66" rx="10" fill="#e8530e" filter="url(#sh)"/>
  <text x="1000.0" y="239.0" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">EXTERNAL email</text>
  <text x="1000.0" y="257.0" text-anchor="middle" fill="#f0f9ff" font-size="11">regex + ALLOWED_EXTERNAL_DOMAINS</text>
  <path d="M570,151 L570,180 L240,180 L240,210" fill="none" stroke="#1B3A6B" stroke-width="2"/>
  <polygon points="235,201 245,201 240,210" fill="#1B3A6B"/>
  <path d="M670,151 L670,180 L1000,180 L1000,210" fill="none" stroke="#1B3A6B" stroke-width="2"/>
  <polygon points="995,201 1005,201 1000,210" fill="#1B3A6B"/>
  <rect x="80" y="340" width="320" height="66" rx="10" fill="#00a843" filter="url(#sh)"/>
  <text x="240.0" y="369.0" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">sf_user_channel ?</text>
  <text x="240.0" y="387.0" text-anchor="middle" fill="#f0f9ff" font-size="11">set per schedule</text>
  <path d="M240,276 L240,340" fill="none" stroke="#29b5e8" stroke-width="2"/>
  <polygon points="235,331 245,331 240,340" fill="#29b5e8"/>
  <rect x="40" y="470" width="330" height="190" rx="10" fill="#eaf7fc" stroke="#29b5e8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="205.0" y="494" text-anchor="middle" fill="#0e7fad" font-size="14" font-weight="bold">NATIVE</text>
  <text x="205.0" y="511" text-anchor="middle" fill="#29b5e8" font-size="11">SYSTEM$SEND_EMAIL · RM_EMAIL_INT</text>
  <line x1="50" y1="521" x2="360" y2="521" stroke="#29b5e8" stroke-opacity="0.35" stroke-width="1"/>
  <text x="54" y="540" text-anchor="start" fill="#444" font-size="11">Verified emails in this account only</text>
  <text x="54" y="558" text-anchor="start" fill="#444" font-size="11">Max 128,000 chars HTML, no attachments</text>
  <text x="54" y="576" text-anchor="start" fill="#444" font-size="11">Artifact button + presigned images</text>
  <text x="54" y="594" text-anchor="start" fill="#444" font-size="11">PDF as presigned link (≤ 7 days)</text>
  <text x="54" y="612" text-anchor="start" fill="#444" font-size="11">Remote images may need &#x27;show images&#x27;</text>
  <rect x="420" y="470" width="360" height="190" rx="10" fill="#fff3ed" stroke="#e8530e" stroke-width="1.5" filter="url(#sh)"/>
  <text x="600.0" y="494" text-anchor="middle" fill="#b33f08" font-size="14" font-weight="bold">EXTERNAL provider (Snowflake users)</text>
  <text x="600.0" y="511" text-anchor="middle" fill="#e8530e" font-size="11">SendGrid / Microsoft Graph</text>
  <line x1="430" y1="521" x2="770" y2="521" stroke="#e8530e" stroke-opacity="0.35" stroke-width="1"/>
  <text x="434" y="540" text-anchor="start" fill="#444" font-size="11">Same CID email as external recipients</text>
  <text x="434" y="558" text-anchor="start" fill="#444" font-size="11">Plus artifact button</text>
  <text x="434" y="576" text-anchor="start" fill="#444" font-size="11">Use when users&#x27; mail blocks remote images</text>
  <text x="434" y="594" text-anchor="start" fill="#444" font-size="11">Counts toward provider quota</text>
  <rect x="830" y="470" width="370" height="190" rx="10" fill="#fff3ed" stroke="#e8530e" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1015.0" y="494" text-anchor="middle" fill="#b33f08" font-size="14" font-weight="bold">External recipients</text>
  <text x="1015.0" y="511" text-anchor="middle" fill="#e8530e" font-size="11">SendGrid / Microsoft Graph</text>
  <line x1="840" y1="521" x2="1190" y2="521" stroke="#e8530e" stroke-opacity="0.35" stroke-width="1"/>
  <text x="844" y="540" text-anchor="start" fill="#444" font-size="11">Inline CID PNG slices (no remote images)</text>
  <text x="844" y="558" text-anchor="start" fill="#444" font-size="11">PDF attached if format PDF / BOTH</text>
  <text x="844" y="576" text-anchor="start" fill="#444" font-size="11">Never receives the artifact link</text>
  <text x="844" y="594" text-anchor="start" fill="#444" font-size="11">Budget: SendGrid 28 MB · Graph 3 MB</text>
  <text x="844" y="612" text-anchor="start" fill="#444" font-size="11">Images re-encoded JPEG if over budget</text>
  <path d="M160,406 L160,470" fill="none" stroke="#00a843" stroke-width="2"/>
  <polygon points="155,461 165,461 160,470" fill="#00a843"/>
  <rect x="133.0" y="430" width="54" height="17" rx="4" fill="#fff"/>
  <text x="160" y="442" text-anchor="middle" fill="#007a31" font-size="10.5">NATIVE</text>
  <path d="M320,406 L320,430 L600,430 L600,470" fill="none" stroke="#00a843" stroke-width="2"/>
  <polygon points="595,461 605,461 600,470" fill="#00a843"/>
  <rect x="426.0" y="422" width="68" height="17" rx="4" fill="#fff"/>
  <text x="460" y="434" text-anchor="middle" fill="#007a31" font-size="10.5">EXTERNAL</text>
  <path d="M1000,276 L1000,470" fill="none" stroke="#e8530e" stroke-width="2"/>
  <polygon points="995,461 1005,461 1000,470" fill="#e8530e"/>
  <rect x="969.5" y="368" width="61" height="17" rx="4" fill="#fff"/>
  <text x="1000" y="380" text-anchor="middle" fill="#b33f08" font-size="10.5">allowed</text>
  <rect x="560" y="290" width="230" height="60" rx="10" fill="#64748b" filter="url(#sh)"/>
  <text x="675.0" y="316.0" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Rejected → SKIPPED</text>
  <text x="675.0" y="334.0" text-anchor="middle" fill="#f0f9ff" font-size="11">logged with reason</text>
  <path d="M840,243 L675,243 L675,290" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="670,281 680,281 675,290" fill="#64748b"/>
  <path d="M400,243 L620,243 L620,290" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="615,281 625,281 620,290" fill="#64748b"/>
</svg>
