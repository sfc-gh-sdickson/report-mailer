<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 910" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1240" height="910" fill="#ffffff"/>
  <text x="620.0" y="40" text-anchor="middle" fill="#1a1a2e" font-size="24" font-weight="bold">Report Mailer - Architecture</text>
  <text x="620.0" y="64" text-anchor="middle" fill="#666" font-size="13">Streamlit schedules · Tasks queue · SPCS renders charts headlessly · native + external email</text>
  <rect x="470" y="88" width="300" height="52" rx="10" fill="#1B3A6B" filter="url(#sh)"/>
  <text x="620.0" y="110.0" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Report authors (Snowsight)</text>
  <text x="620.0" y="128.0" text-anchor="middle" fill="#f0f9ff" font-size="11">role RM_USER</text>
  <rect x="30" y="168" width="1180" height="470" rx="14" fill="#f7fcfe" stroke="#29b5e8" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="1192" y="192" text-anchor="end" fill="#0e7fad" font-size="13" font-weight="bold">SNOWFLAKE ACCOUNT  ·  REPORT_MAILER.APP</text>
  <rect x="60" y="210" width="250" height="170" rx="10" fill="#eaf7fc" stroke="#29b5e8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="185.0" y="234" text-anchor="middle" fill="#0e7fad" font-size="14" font-weight="bold">Streamlit app</text>
  <text x="185.0" y="251" text-anchor="middle" fill="#29b5e8" font-size="11">REPORT_MAILER_APP · owner&#x27;s rights</text>
  <line x1="70" y1="261" x2="300" y2="261" stroke="#29b5e8" stroke-opacity="0.35" stroke-width="1"/>
  <text x="74" y="280" text-anchor="start" fill="#444" font-size="11">Register HTML / PDF / artifact</text>
  <text x="74" y="298" text-anchor="start" fill="#444" font-size="11">Schedules + recipients</text>
  <text x="74" y="316" text-anchor="start" fill="#444" font-size="11">Send now / test to me</text>
  <text x="74" y="334" text-anchor="start" fill="#444" font-size="11">Run history, admin settings</text>
  <circle cx="60" cy="210" r="13" fill="#fff" stroke="#29b5e8" stroke-width="2"/>
  <text x="60" y="214.5" text-anchor="middle" fill="#29b5e8" font-size="12" font-weight="bold">1</text>
  <rect x="350" y="210" width="250" height="170" rx="10" fill="#f3f0ff" stroke="#7b61ff" stroke-width="1.5" filter="url(#sh)"/>
  <text x="475.0" y="234" text-anchor="middle" fill="#5a3ec8" font-size="14" font-weight="bold">Metadata</text>
  <text x="475.0" y="251" text-anchor="middle" fill="#7b61ff" font-size="11">tables + append-only stream</text>
  <line x1="360" y1="261" x2="590" y2="261" stroke="#7b61ff" stroke-opacity="0.35" stroke-width="1"/>
  <text x="364" y="280" text-anchor="start" fill="#444" font-size="11">REPORTS · SCHEDULES</text>
  <text x="364" y="298" text-anchor="start" fill="#444" font-size="11">SCHEDULE_RECIPIENTS</text>
  <text x="364" y="316" text-anchor="start" fill="#444" font-size="11">RUNS  →  RUNS_STREAM</text>
  <text x="364" y="334" text-anchor="start" fill="#444" font-size="11">DELIVERY_LOG · APP_CONFIG</text>
  <circle cx="350" cy="210" r="13" fill="#fff" stroke="#7b61ff" stroke-width="2"/>
  <text x="350" y="214.5" text-anchor="middle" fill="#7b61ff" font-size="12" font-weight="bold">2</text>
  <rect x="640" y="210" width="250" height="170" rx="10" fill="#edf9f0" stroke="#00a843" stroke-width="1.5" filter="url(#sh)"/>
  <text x="765.0" y="234" text-anchor="middle" fill="#007a31" font-size="14" font-weight="bold">Tasks</text>
  <text x="765.0" y="251" text-anchor="middle" fill="#00a843" font-size="11">warehouse RM_WH</text>
  <line x1="650" y1="261" x2="880" y2="261" stroke="#00a843" stroke-opacity="0.35" stroke-width="1"/>
  <text x="654" y="280" text-anchor="start" fill="#444" font-size="11">RM_SCHEDULE_&lt;id&gt;  (CRON)</text>
  <text x="654" y="298" text-anchor="start" fill="#444" font-size="11">  → ENQUEUE_RUN()</text>
  <text x="654" y="316" text-anchor="start" fill="#444" font-size="11">RM_DISPATCHER_TASK (stream)</text>
  <text x="654" y="334" text-anchor="start" fill="#444" font-size="11">  → LAUNCH_QUEUED_RUNS()</text>
  <circle cx="640" cy="210" r="13" fill="#fff" stroke="#00a843" stroke-width="2"/>
  <text x="640" y="214.5" text-anchor="middle" fill="#00a843" font-size="12" font-weight="bold">3</text>
  <rect x="930" y="210" width="250" height="170" rx="10" fill="#fff3ed" stroke="#e8530e" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1055.0" y="234" text-anchor="middle" fill="#b33f08" font-size="14" font-weight="bold">SPCS render job</text>
  <text x="1055.0" y="251" text-anchor="middle" fill="#e8530e" font-size="11">compute pool RM_POOL</text>
  <line x1="940" y1="261" x2="1170" y2="261" stroke="#e8530e" stroke-opacity="0.35" stroke-width="1"/>
  <text x="944" y="280" text-anchor="start" fill="#444" font-size="11">Headless Chromium (Playwright)</text>
  <text x="944" y="298" text-anchor="start" fill="#444" font-size="11">Charts → PNG slices + PDF</text>
  <text x="944" y="316" text-anchor="start" fill="#444" font-size="11">Compose CID / native email</text>
  <text x="944" y="334" text-anchor="start" fill="#444" font-size="11">Send + log each recipient</text>
  <circle cx="930" cy="210" r="13" fill="#fff" stroke="#e8530e" stroke-width="2"/>
  <text x="930" y="214.5" text-anchor="middle" fill="#e8530e" font-size="12" font-weight="bold">4</text>
