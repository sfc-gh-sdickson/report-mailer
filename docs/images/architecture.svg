  <text x="230.0" y="731" text-anchor="middle" fill="#29b5e8" font-size="11">SYSTEM$SEND_EMAIL (verified emails)</text>
  <line x1="70" y1="741" x2="390" y2="741" stroke="#29b5e8" stroke-opacity="0.35" stroke-width="1"/>
  <text x="74" y="760" text-anchor="start" fill="#444" font-size="11">Button: open the artifact (live / snapshot)</text>
  <text x="74" y="778" text-anchor="start" fill="#444" font-size="11">Images via 7-day presigned URLs</text>
  <text x="74" y="796" text-anchor="start" fill="#444" font-size="11">PDF download link</text>
  <text x="74" y="814" text-anchor="start" fill="#444" font-size="11">Or same provider email if channel = EXTERNAL</text>
  <rect x="450" y="690" width="340" height="170" rx="10" fill="#fff3ed" stroke="#e8530e" stroke-width="1.5" filter="url(#sh)"/>
  <text x="620.0" y="714" text-anchor="middle" fill="#b33f08" font-size="14" font-weight="bold">External recipients</text>
  <text x="620.0" y="731" text-anchor="middle" fill="#e8530e" font-size="11">SendGrid or Microsoft Graph</text>
  <line x1="460" y1="741" x2="780" y2="741" stroke="#e8530e" stroke-opacity="0.35" stroke-width="1"/>
  <text x="464" y="760" text-anchor="start" fill="#444" font-size="11">Charts as inline CID PNG images</text>
  <text x="464" y="778" text-anchor="start" fill="#444" font-size="11">PDF attached (optional)</text>
  <text x="464" y="796" text-anchor="start" fill="#444" font-size="11">Domain allowlist enforced twice</text>
  <text x="464" y="814" text-anchor="start" fill="#444" font-size="11">No artifact link (needs Snowflake login)</text>
  <rect x="840" y="690" width="340" height="170" rx="10" fill="#f3f0ff" stroke="#7b61ff" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1010.0" y="714" text-anchor="middle" fill="#5a3ec8" font-size="14" font-weight="bold">Snowflake artifact</text>
  <text x="1010.0" y="731" text-anchor="middle" fill="#7b61ff" font-size="11">Workspaces / CoCo publish</text>
  <line x1="850" y1="741" x2="1170" y2="741" stroke="#7b61ff" stroke-opacity="0.35" stroke-width="1"/>
  <text x="854" y="760" text-anchor="start" fill="#444" font-size="11">Report / File: static snapshot</text>
  <text x="854" y="778" text-anchor="start" fill="#444" font-size="11">Dashboard: live data</text>
  <text x="854" y="796" text-anchor="start" fill="#444" font-size="11">Shared to a role; same link on re-publish</text>
  <text x="854" y="814" text-anchor="start" fill="#444" font-size="11">Publishing is manual (no SQL API yet)</text>
