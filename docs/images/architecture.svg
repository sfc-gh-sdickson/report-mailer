  <text x="230.0" y="471" text-anchor="middle" fill="#29b5e8" font-size="11">mounted as SPCS stage volumes</text>
  <line x1="70" y1="481" x2="390" y2="481" stroke="#29b5e8" stroke-opacity="0.35" stroke-width="1"/>
  <text x="74" y="500" text-anchor="start" fill="#444" font-size="11">@REPORT_SOURCES  → /mnt/reports  (source of record)</text>
  <text x="74" y="518" text-anchor="start" fill="#444" font-size="11">@REPORT_OUTPUTS  → /mnt/outputs  (per run id)</text>
  <text x="74" y="536" text-anchor="start" fill="#444" font-size="11">@RM_SPECS  report_job.yaml template</text>
  <text x="74" y="554" text-anchor="start" fill="#444" font-size="11">Image repo RM_IMAGES  report-renderer:1.0.0</text>
  <rect x="440" y="430" width="360" height="180" rx="10" fill="#f3f0ff" stroke="#7b61ff" stroke-width="1.5" filter="url(#sh)"/>
  <text x="620.0" y="454" text-anchor="middle" fill="#5a3ec8" font-size="14" font-weight="bold">Integrations + secret</text>
  <text x="620.0" y="471" text-anchor="middle" fill="#7b61ff" font-size="11">least-privilege egress</text>
  <line x1="450" y1="481" x2="790" y2="481" stroke="#7b61ff" stroke-opacity="0.35" stroke-width="1"/>
  <text x="454" y="500" text-anchor="start" fill="#444" font-size="11">RM_EMAIL_INT  (TYPE = EMAIL)</text>
  <text x="454" y="518" text-anchor="start" fill="#444" font-size="11">RM_EGRESS_RULE  mail API + chart CDNs</text>
  <text x="454" y="536" text-anchor="start" fill="#444" font-size="11">RM_MAIL_EAI  external access integration</text>
  <text x="454" y="554" text-anchor="start" fill="#444" font-size="11">RM_MAIL_SECRET  provider JSON credentials</text>
  <rect x="840" y="430" width="340" height="180" rx="10" fill="#edf9f0" stroke="#00a843" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1010.0" y="454" text-anchor="middle" fill="#007a31" font-size="14" font-weight="bold">Directory lookups</text>
  <text x="1010.0" y="471" text-anchor="middle" fill="#00a843" font-size="11">SNOWFLAKE.SECURITY_VIEWER</text>
  <line x1="850" y1="481" x2="1170" y2="481" stroke="#00a843" stroke-opacity="0.35" stroke-width="1"/>
  <text x="854" y="500" text-anchor="start" fill="#444" font-size="11">ACCOUNT_USAGE.USERS  (emails)</text>
  <text x="854" y="518" text-anchor="start" fill="#444" font-size="11">GRANTS_TO_USERS / GRANTS_TO_ROLES</text>
  <text x="854" y="536" text-anchor="start" fill="#444" font-size="11">Roles expanded recursively</text>
  <text x="854" y="554" text-anchor="start" fill="#444" font-size="11">Latency up to 2 hours</text>
